<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Compose preview</title>
<style>
:root { color-scheme: light dark; font: 14px system-ui, sans-serif; }
body { margin: 0; padding: 16px; }
header { position: sticky; top: 0; background: Canvas; padding: 8px 0; z-index: 1; }
button { font: inherit; padding: 6px 12px; cursor: pointer; }
#status { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }
#activity { margin: 12px 0; padding: 16px; border: 1px solid GrayText; border-radius: 8px; }
#progress { display: block; width: 100%; height: 6px; margin-top: 12px; accent-color: Highlight; }
#progress[hidden], #diagnostics[hidden] { display: none; }
#diagnostics { margin-top: 12px; }
#diagnostics summary { cursor: pointer; color: GrayText; }
#detail { max-height: 200px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12px; }
#gallery { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 16px; }
article { border: 1px solid GrayText; border-radius: 8px; padding: 12px; max-width: 100%; }
h2 { font-size: 15px; margin: 0 0 6px; }
.detail, .hint { color: GrayText; font-size: 12px; }
img { display: block; max-width: 100%; height: auto; touch-action: none; user-select: none; }
img:focus { outline: 2px solid Highlight; outline-offset: 2px; }
.error { white-space: pre-wrap; max-width: 600px; }
</style>
</head>
<body>
<header>
<button id="refresh" disabled>Refresh</button>
<button id="stop">Stop</button>
<div id="activity" aria-busy="true">
<p id="status" role="status">Connecting…</p>
<progress id="progress" aria-labelledby="status"></progress>
<details id="diagnostics" hidden><summary>Details</summary><pre id="detail"></pre></details>
</div>
<p class="hint">Click to focus · Drag and scroll to interact · Escape to release input</p>
</header>
<main id="gallery"></main>
<script src="./client.js"></script>
</body>
</html>
