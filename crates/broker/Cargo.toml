[package]
name = "elide-tern-broker"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "elide-tern-broker"
path = "src/main.rs"

[[bin]]
name = "elide-tern-worker"
path = "src/worker.rs"

[dependencies]
capnp = "=0.27.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs2 = "0.4.3"
libc = "0.2"
elide-embed-host = { path = "../../../elide/crates/embed-host" }
elide-project-session = { path = "../../../elide/crates/project-session" }
