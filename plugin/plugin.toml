schema = 1
id = "elide"
name = "Elide"
version = "0.1.0-preview.1"
description = "Embedded polyglot runtime sessions for Tern."
window = "window.luau"
host = "host.luau"
styles = ["styles/source.css", "styles/compose.css", "styles/icons.css"]

[[lenses]]
id = "json"
match = ["elide project *", "elide * --json", "elide * --json *", "elide --json *"]

[[lenses]]
id = "build"
match = ["elide build", "elide build *", "elide javac *", "elide kotlinc *"]

[[lenses]]
id = "tap"
match = ["elide test --reporter=tap*", "elide test * --reporter=tap*"]

[[blocks]]
id = "source"
title = "Elide source"
files = ["*.js", "*.mjs", "*.cjs", "*.ts", "*.mts", "*.cts", "*.py", "*.kt", "*.kts", "*.java"]
# Opens on a file ("Open with Elide source", elide://source, the workspace toolbar); never empty.
palette = false

[[blocks]]
id = "compose"
title = "Compose previews"
# Explicit project/palette/workspace launch supplies the saved .kt and its project root.
palette = false
